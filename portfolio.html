<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Портфолио - Электрика везде</title>
    <style>
        /* Базовые стили */
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Manrope", sans-serif; color: #ededed; background: radial-gradient(circle at 12% 0%, #2a2a2a, #121212); min-height: 100vh; }
        .container { margin: 24px auto; max-width: 800px; padding: 0 20px; }
        
        /* Стили для заголовка H1 */
        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
            position: relative;
            display: inline-block;
            background: linear-gradient(90deg, #ff8c00, #ffcc00, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 5px 15px rgba(255, 140, 0, 0.4));
        }

        /* Декоративная полоска под заголовком */
        h1::after {
            content: "";
            display: block;
            width: 80px;
            height: 5px;
            background: #ff8c00;
            margin-top: 15px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(255, 140, 0, 0.8);
        }

        /* Плашка под заголовком */
        .container > p {
            font-size: 1.1rem;
            color: #b0b0b0;
            margin-top: 10px;
            margin-bottom: 40px;
            display: inline-block;
            background: rgba(255, 140, 0, 0.1);
            border: 1px solid rgba(255, 140, 0, 0.3);
            padding: 10px 20px;
            border-radius: 30px;
            letter-spacing: 1px;
        }

        /* Меню */
        .navbar { background-color: #111; padding: 15px 0; text-align: center; border-bottom: 2px solid #ff8c00; }
        .navbar ul { list-style: none; margin: 0; padding: 0; display: flex; justify-content: center; gap: 20px; }
        .navbar a { color: #fff; text-decoration: none; font-weight: bold; text-transform: uppercase; font-size: 14px; }
        .navbar a:hover { color: #ff8c00; }

        /* --- СЕТКА И КАРТОЧКИ --- */
        .portfolio-grid {
            display: grid !important; 
            grid-template-columns: repeat(3, 1fr) !important; 
            gap: 15px;
            margin-top: 20px;
        }

        .portfolio-item {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            transition: all 0.4s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .portfolio-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(255, 140, 0, 0.4);
        }

        .portfolio-item img {
            width: 100% !important; 
            aspect-ratio: 4 / 3 !important; 
            object-fit: cover !important; 
            display: block;
            transition: transform 0.5s ease;
        }

        .portfolio-item:hover img {
            transform: scale(1.08);
        }
        
        @media (max-width: 768px) {
            .portfolio-grid { grid-template-columns: repeat(2, 1fr) !important; }
        }
        @media (max-width: 480px) {
            .portfolio-grid { grid-template-columns: 1fr !important; }
        }
    </style>
</head>
