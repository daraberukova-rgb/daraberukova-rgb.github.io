       /* Стили для заголовка H1 (Портфолио) */
            h1 {
                font-size: 3.5rem;
                font-weight: 900;
                text-transform: uppercase;
                letter-spacing: 3px;
                margin-bottom: 10px;
                position: relative;
                display: inline-block;
                background: linear-gradient(90deg, #ff8c00, #ffcc00, #ff8c00);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                filter: drop-shadow(0px 5px 15px rgba(255, 140, 0, 0.4));
            }

            /* Декоративная полоска под заголовком */
            h1::after {
                content: "";
                display: block;
                width: 80px;
                height: 5px;
                background: #ff8c00;
                margin-top: 15px;
                border-radius: 5px;

        .card { padding: 20px; background: #1a1a1a; border-left: 4px solid #ff8c00; border-radius: 8px; margin-bottom: 20px; }

       /* Сетка для портфолио */
.portfolio-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr); /* ВОТ ЭТА СТРОЧКА ДЕЛАЕТ ПО 3 В РЯД */
    gap: 15px; /* Расстояние между фото */
    margin-top: 20px;
}

/* Чтобы на телефонах и планшетах фото не были слишком мелкими, добавим адаптив */
@media (max-width: 768px) {
    .portfolio-grid {
        grid-template-columns: repeat(2, 1fr); /* На планшетах по 2 */
    }
}
@media (max-width: 480px) {
    .portfolio-grid {
        grid-template-columns: 1fr; /* На телефонах по 1 */
    }
}

/* Карточка одной работы */
.portfolio-item {
    background: #1a1a1a;
    border-radius: 12px; 
    overflow: hidden;
    position: relative; 
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); /* Тень в обычном состоянии */
}

/* Эффект при наведении мышки на карточку */
.portfolio-item:hover {
    transform: translateY(-8px); /* Карточка красиво подпрыгивает вверх */
    box-shadow: 0 12px 25px rgba(255, 140, 0, 0.4); /* Появляется оранжевое неоновое свечение */
}

/* Картинка внутри */
.portfolio-item img {
    width: 100%;
    aspect-ratio: 4 / 3; 
    object-fit: cover; 
    display: block;
    transition: transform 0.5s ease; /* Плавный зум картинки */
}
