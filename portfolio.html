<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Портфолио - Электрика везде</title>
    <style>
        /* Те же базовые стили и меню */
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Manrope", sans-serif; color: #ededed; background: radial-gradient(circle at 12% 0%, rgba(255,140,0,0.15), transparent 40%), #0a0a0a; min-height: 100vh; }
        .container { margin: 24px auto; max-width: 800px; padding: 0 20px; }
        h1 { font-size: 2.6rem; background: linear-gradient(90deg, #ff8c00, #ffcc00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card { padding: 20px; background: #1a1a1a; border-left: 4px solid #ff8c00; border-radius: 8px; margin-bottom: 20px; }
        .navbar { background-color: #111; padding: 15px 0; text-align: center; border-bottom: 2px solid #ff8c00; }
        .navbar ul { list-style: none; margin: 0; padding: 0; display: flex; justify-content: center; gap: 30px; }
        .navbar a { color: #fff; text-decoration: none; font-weight: bold; text-transform: uppercase; font-size: 16px; }
        .navbar a:hover { color: #ff8c00; }
        /* Сетка для портфолио */
.portfolio-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
    margin-top: 20px;
}

/* Карточка одной работы */
.portfolio-item {
    background: #1a1a1a;
    border-radius: 8px;
    overflow: hidden;
    border-bottom: 4px solid #ff8c00; /* Оранжевая полоска снизу */
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    display: flex;
    flex-direction: column;
}

/* Эффект при наведении мышки */
.portfolio-item:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(255, 140, 0, 0.2);
}

/* Картинка внутри */
.portfolio-item img {
    width: 100%;
    aspect-ratio: 4 / 3; /* Делает все фото одинаковыми прямоугольниками, как на фотоаппарате */
    object-fit: cover; /* Обрезает края, чтобы фото не растягивалось */
    display: block;
    transition: transform 0.4s ease; /* Плавное увеличение */
}

/* Эффект при наведении на карточку (фото будет плавно приближаться) */
.portfolio-item:hover img {
    transform: scale(1.08); /* Увеличиваем фото на 8% */
}

/* Текст внутри карточки */
.portfolio-info {
    padding: 15px;
    flex-grow: 1;
}

.portfolio-info h3 {
    margin: 0 0 10px 0;
    color: #ff8c00;
    font-size: 1.2rem;
}

.portfolio-info p {
    margin: 0;
    font-size: 0.9rem;
    color: #ccc;
    line-height: 1.4;
}
    </style>
